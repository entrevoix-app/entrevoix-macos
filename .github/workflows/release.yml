name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 0.1.0)
        required: true
        type: string
      build_number:
        description: Monotonic Sparkle build number
        required: true
        type: string
      channel:
        description: Sparkle update channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc
          - dev
      release_notes:
        description: Release notes markdown
        required: true
        type: string
      draft:
        description: Leave the release as a draft after uploads
        required: true
        default: true
        type: boolean
permissions:
  contents: write

jobs:
  release:
    name: Build DMG and create GitHub release
    runs-on: macos-26
    env:
      ENTREVOIX_VERSION: ${{ inputs.version }}
      ENTREVOIX_BUILD_NUMBER: ${{ inputs.build_number }}
      GH_TOKEN: ${{ github.token }}
      SPARKLE_VERSION: 2.9.5
      SPARKLE_DISTRIBUTION_SHA256: ${{ secrets.SPARKLE_DISTRIBUTION_SHA256 }}
      ENTREVOIX_CHANNEL: ${{ inputs.channel }}

    concurrency:
      # Shares the appcast lock with release:published so a direct release
      # and the event-driven publisher can never push gh-pages concurrently.
      group: entrevoix-sparkle-appcast
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        id: toolchain
        run: |
          xcode_version="$(xcodebuild -version)"
          swift_version="$(swift --version 2>&1)"
          printf '%s\n' "$xcode_version"
          printf '%s\n' "$swift_version"
          xcrun --find xcstringstool
          fingerprint="$(printf '%s\n%s\n' "$xcode_version" "$swift_version" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Validate monotonic Sparkle build number
        run: |
          feed_path="$RUNNER_TEMP/current-appcast.xml"
          if ! curl --fail --location --silent --show-error \
            "https://entrevoix-app.github.io/entrevoix-macos/appcast.xml" \
            -o "$feed_path"; then
            curl --fail --location --silent --show-error \
              "https://github.com/entrevoix-app/entrevoix-macos/releases/latest/download/appcast.xml" \
              -o "$feed_path"
          fi
          ./Scripts/validate-release-channel.sh "$ENTREVOIX_CHANNEL" "$ENTREVOIX_VERSION" "$ENTREVOIX_BUILD_NUMBER" "$feed_path"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
          enableCrossOsArchive: false

      - name: Build and test
        run: |
          ./Scripts/test-release-channel.sh
          swift build -Xswiftc -warnings-as-errors
          ./Scripts/check-architecture.sh
          ./Scripts/check-coverage.sh

      - name: Audit repository contents
        run: |
          ! git ls-files | grep -E '\.(wav|aiff|aif|caf|m4a|mp3|p12|mobileprovision)$'
          ! git grep -nE 'sk-[A-Za-z0-9]{20,}'

      - name: Sign, notarize, and build DMG
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./Scripts/release.sh

      - name: Download Sparkle release tooling
        run: |
          sparkle_archive="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$sparkle_archive"
          actual_checksum="$(shasum -a 256 "$sparkle_archive" | cut -d ' ' -f 1)"
          if [[ "$actual_checksum" != "$SPARKLE_DISTRIBUTION_SHA256" ]]; then
            echo "Sparkle distribution checksum mismatch"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$sparkle_archive" -C "$RUNNER_TEMP/sparkle"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          artifacts_directory="$GITHUB_WORKSPACE/.build/release-artifacts"
          private_key_path="$RUNNER_TEMP/sparkle_ed25519_private_key"
          if [[ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]]; then
            echo "Required secret: SPARKLE_EDDSA_PRIVATE_KEY"
            exit 1
          fi
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$private_key_path"
          chmod 600 "$private_key_path"
          channel_args=()
          [[ "$ENTREVOIX_CHANNEL" == stable ]] || channel_args=(--channel "$ENTREVOIX_CHANNEL")
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$private_key_path" \
            "${channel_args[@]}" \
            --download-url-prefix "https://github.com/entrevoix-app/entrevoix-macos/releases/download/v$ENTREVOIX_VERSION/" \
            "$artifacts_directory"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Entrevoix-${{ inputs.version }}-macos
          path: |
            .build/release-artifacts/*.dmg
            .build/release-artifacts/appcast.xml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Create GitHub release
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          tag="v$ENTREVOIX_VERSION"
          notes_path="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_path"
          release_args=("$tag" ".build/release-artifacts/Entrevoix-$ENTREVOIX_VERSION-macos.dmg" ".build/release-artifacts/appcast.xml" "--title" "Entrevoix $ENTREVOIX_VERSION" "--notes-file" "$notes_path" "--draft")
          [[ "$ENTREVOIX_CHANNEL" != "stable" ]] && release_args+=("--prerelease")
          gh release create "${release_args[@]}"

      - name: Publish GitHub release
        if: ${{ !inputs.draft }}
        run: gh release edit "v$ENTREVOIX_VERSION" --draft=false

      - name: Publish cumulative Sparkle appcast
        if: ${{ !inputs.draft }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENTREVOIX_TAG: v${{ inputs.version }}
          SPARKLE_BIN_DIRECTORY: ${{ runner.temp }}/sparkle/bin
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: ./Scripts/publish-appcast.sh
