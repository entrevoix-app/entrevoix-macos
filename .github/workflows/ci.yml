name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        id: toolchain
        run: |
          xcode_version="$(xcodebuild -version)"
          swift_version="$(swift --version 2>&1)"
          printf '%s\n' "$xcode_version"
          printf '%s\n' "$swift_version"
          xcrun --find xcstringstool
          fingerprint="$(printf '%s\n%s\n' "$xcode_version" "$swift_version" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
          enableCrossOsArchive: false

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Check architecture boundaries
        run: ./Scripts/check-architecture.sh

      - name: Test
        run: ./Scripts/check-coverage.sh

      - name: Verify app bundle
        run: |
          ENTREVOIX_ALLOW_ADHOC_SIGNING=1 ENTREVOIX_SKIP_OPEN=1 ./Scripts/run-app.sh
          ./Scripts/verify-app-bundle.sh "$(swift build --show-bin-path)/Entrevoix.app"

      - name: Audit repository contents
        run: |
          ! git ls-files | grep -E '\.(wav|aiff|aif|caf|m4a|mp3|p12|mobileprovision)$'
          ! git grep -nE 'sk-[A-Za-z0-9]{20,}'
